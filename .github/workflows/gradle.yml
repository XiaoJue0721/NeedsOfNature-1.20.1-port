name: Build Mod JAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 核心修改：加入 clean 清理环境，加入 remapJar 强制生成最终 Mod 包
      - name: Build with Gradle
        run: ./gradlew clean build remapJar

      # 加一步：把生成的路径打印出来看看，方便排错
      - name: Show Generated JARs
        run: ls -R build/libs

      # 上传步骤：路径写宽松一点，匹配所有 jar
      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          if-no-files-found: error
