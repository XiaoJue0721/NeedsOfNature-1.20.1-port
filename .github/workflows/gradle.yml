name: Build Mod JAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. 授予 gradlew 执行权限（Linux 环境必需）
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 设置 Gradle 缓存，加速后续构建
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. 执行构建，生成 JAR ！！！（这一步必须在 Debug 和 Upload 前面）
      - name: Build with Gradle
        run: ./gradlew --no-daemon build

      # 6. 临时调试：现在编译完了，来看看 build 目录下到底生成了什么
      - name: Debug - List build outputs
        run: |
          echo "=== 正在查找所有的 jar 文件 ==="
          find build/ -name "*.jar" || true
          echo "=== 正在查看 build 目录结构 ==="
          ls -R build/ || true

      # 7. 上传构建产物（JAR 文件）
      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          retention-days: 7
