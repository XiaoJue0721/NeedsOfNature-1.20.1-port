name: Build Mod JAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 构建命令。如果这里报错，请一定截图发给我！
      - name: Build with Gradle
        run: ./gradlew clean build

      # 全盘搜索：在整个目录下寻找所有的 jar 文件，排除 gradle/wrapper 目录
      - name: Find All JARs
        run: |
          echo "=== 正在全盘搜索所有的 jar 文件 ==="
          find . -name "*.jar" ! -path "*/gradle/wrapper/*"

      # 上传：使用通配符 ** 匹配任何目录下的 jar
      - name: Upload All JARs
        uses: actions/upload-artifact@v4
        with:
          name: all-jars
          # 注意这里改成了全盘匹配，并且排除了 wrapper 自带的 jar
          path: |
            **/*.jar
            !**/gradle/wrapper/*.jar
          if-no-files-found: error
