name: Build Mod JAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. 赋予 gradlew 执行权限（必须）
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 设置 Gradle 缓存
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. 执行构建（使用标准 build，Fabric 默认包含 remapJar）
      - name: Build with Gradle
        run: ./gradlew build

      # 6. 上传构建产物（必须要在 build 之后）
      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          # 这一句极其关键：如果没找到 jar，直接报错，不准假装成功！
          if-no-files-found: error
          retention-days: 7
