name: Build Mod JAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 JDK（版本需与 build.gradle 中的 sourceCompatibility 一致）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 授予 gradlew 执行权限（Linux 环境必需）
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 设置 Gradle 缓存，加速后续构建
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. 执行构建，生成 JAR
      - name: Build with Gradle
        run: ./gradlew --no-daemon build

      # 6. 上传构建产物（JAR 文件）
      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          retention-days: 7
