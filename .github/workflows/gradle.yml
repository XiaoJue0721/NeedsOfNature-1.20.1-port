name: Build Mod JAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 JDK 21 (Fabric Loom 必需)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. 授予 gradlew 执行权限（Linux 环境必需）
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 设置 Gradle 缓存，加速后续构建
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. 执行构建 (加上了 -x test 防止因为测试代码报错导致打包中断)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 6. 精准上传最终的 Mod 包
      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Jar
          path: |
            **/build/libs/*.jar
            !**/*-sources.jar
            !**/*-dev.jar
          if-no-files-found: error
          retention-days: 7
